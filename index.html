<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>JoSell - Achat, Vente & Sécurité</title>

  <!-- Configuration PWA -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#0a3d62">

  <!-- Liaison avec le fichier CSS -->
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Conteneur Mobile -->
  <div class="app-container">

    <header>
      <h1>JoSell</h1>
    </header>

    <!-- 1. FORMULAIRE D'INSCRIPTION / CONNEXION CLIENT -->
    <div class="card" id="auth-section">
      <h2>Inscription Rapide</h2>
      <form id="signup-form">
        <input type="text" id="input-nom" placeholder="Nom" required>
        <input type="text" id="input-postnom" placeholder="Postnom">
        <input type="text" id="input-prenom" placeholder="Prénom" required>
        <input type="tel" id="input-tel" placeholder="N° Téléphone (+243...)" required>
        <input type="tel" id="input-om" placeholder="N° Orange Money" required>
        <input type="tel" id="input-wa" placeholder="N° WhatsApp (Optionnel)">
        <input type="email" id="input-email" placeholder="Adresse Gmail" required>
        <input type="password" id="input-pass" placeholder="Mot de passe" required>
        <button type="submit" id="btn-submit">Se connecter / S'inscrire</button>
      </form>
    </div>

    <!-- 2. CATALOGUE PRODUITS (VUE CLIENT) -->
    <div class="card">
      <h2>Produits Disponibles</h2>
      <div class="grid-products">
        <div class="product-card">
          <img src="logo.png" alt="Produit" style="max-width:100%; height:auto;">
          <h4>Nom du Produit</h4>
          <p class="price">15 000 FC</p>
          <button>Acheter (Séquestre)</button>
        </div>
      </div>
    </div>

    <!-- 3. ESPACE VENDEUR (MARKETING & WALLET) -->
    <div class="card">
      <h2>Espace Vendeur</h2>
      <p>Solde Séquestre : <strong>0 FC</strong></p>
      <p>Solde Disponible : <strong>0 FC</strong></p>
      <button style="margin-top:10px;">Ajouter un Produit</button>
      <button class="btn-wa" style="margin-top:10px;">Partager ma Boutique sur WhatsApp</button>
    </div>

    <!-- 4. PANNEAU ADMIN (ACCUEIL WHATSAPP DIRECT) -->
    <div class="card">
      <h2>Admin - Nouveaux Clients</h2>
      <div style="display:flex; justify-scale:space-between; align-items:center;">
        <div>
          <strong>Jean-Paul KABANGU</strong><br>
          <small>+243810000000</small>
        </div>
        <a href="https://wa.me/243810000000?text=Bonjour%20Jean-Paul,%20bienvenue%20sur%20JoSell%20!" target="_blank" style="text-decoration:none;">
          <button class="btn-wa" style="width:auto; padding:0 10px; height:38px;">WhatsApp</button>
        </a>
      </div>
    </div>

  </div>

  <!-- SCRIPT CORRIGÉ ET SÉCURISÉ -->
  <script>
    // Activation du Service Worker pour PWA
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js').catch(function(err) {
        console.log('Service Worker non enregistré:', err);
      });
    }

    // Exécution après le chargement du DOM
    document.addEventListener('DOMContentLoaded', function() {
      
      const authSection = document.getElementById('auth-section');
      const signupForm = document.getElementById('signup-form');

      // Vérifier si un utilisateur est déjà enregistré dans le navigateur
      const userExiste = localStorage.getItem('user_josell');
      if (userExiste) {
        authSection.style.display = 'none';
      }

      // Écoute de la soumission du formulaire
      signupForm.addEventListener('submit', function(e) {
        e.preventDefault();

        // Récupération sécurisée par ID
        const client = {
          nom: document.getElementById('input-nom').value,
          postnom: document.getElementById('input-postnom').value,
          prenom: document.getElementById('input-prenom').value,
          telephone: document.getElementById('input-tel').value,
          orange_money: document.getElementById('input-om').value,
          whatsapp: document.getElementById('input-wa').value,
          email: document.getElementById('input-email').value,
          password: document.getElementById('input-pass').value
        };

        // Sauvegarde locale
        localStorage.setItem('user_josell', JSON.stringify(client));

        // Confirmation visuelle
        alert('Bienvenue sur JoSell ' + client.prenom + ' ! Inscription réussie.');
        
        // Masquer le formulaire
        authSection.style.display = 'none';
      });

    });
  </script>

</body>
</html>
